<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>SSQA v2 · Hi-Fi Mockups</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="hifi.css" />
  <style>
    html, body { background: #ececec; height: 100%; }
    /* DC adjustments */
    .dc-canvas { background: #ececec; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="hifi-app.jsx"></script>
  <script type="text/babel" src="hifi-batch.jsx"></script>

  <script type="text/babel">
    const App = () => (
      <DesignCanvas title="SSQA v2 — Hi-Fi (repo design system)">
        <DCSection id="screens" title="Screens">
          <DCArtboard id="empty" label="01 · Empty state (drop + how-it-works + sidebar)" width={1280} height={1000}>
            <EmptyHi />
          </DCArtboard>
          <DCArtboard id="single" label="02 · Single article result · Hero B" width={1280} height={2400}>
            <SingleHi />
          </DCArtboard>
          <DCArtboard id="batch" label="03 · Batch list (one row inline-expanded)" width={1380} height={2400}>
            <BatchHi />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
