<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSQA — Sport Science Quality Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="header-logo">SQ</div>
    <h1>Sport Science Quality Analyzer <span>v1.0</span></h1>
    <div class="header-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Checking...</span>
    </div>
</header>

<main class="container">

    <!-- Upload Section -->
    <section class="upload-section">
        <h2>Upload Research Papers</h2>
        <p>Upload one or more PDF files for quality assessment. Batch mode supports up to 10 papers.</p>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">&#128196;</div>
            <div class="drop-zone-text">
                Drag &amp; drop PDF files here, or <strong id="browseBtn">browse files</strong>
            </div>
            <input type="file" id="fileInput" accept=".pdf" multiple>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="btn-row">
            <button class="btn btn-primary" id="analyzeBtn" disabled>
                Analyze Papers
            </button>
            <button class="btn btn-secondary" id="clearBtn" style="display:none">
                Clear All
            </button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Analyzing papers...</div>
        </div>
    </section>

    <!-- Results Section -->
    <section class="results-section" id="resultsSection">

        <!-- Tabs (shown only for batch) -->
        <div class="tabs" id="resultTabs" style="display:none">
            <button class="tab active" data-tab="table">Comparative Table</button>
            <button class="tab" data-tab="details">Detailed Reports</button>
        </div>

        <!-- Batch Table View -->
        <div id="tableView"></div>

        <!-- Detailed Cards View -->
        <div id="detailsView"></div>

    </section>

</main>

<!-- Toast container -->
<div class="toast toast-error" id="toast"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
